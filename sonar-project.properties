# =============================================================================
# SonarCloud Configuration – SAST Analysis
# Replace <SONAR_ORG> and <SONAR_PROJECT_KEY> with your SonarCloud organization and project key.
# Organization: <SONAR_ORG>
# Project: <SONAR_PROJECT_KEY>
# =============================================================================

sonar.organization=<SONAR_ORG>
sonar.projectKey=<SONAR_PROJECT_KEY>
sonar.projectName=Online Boutique

# Source directories
sonar.sources=src/

# Exclusions – skip vendor, generated, and test files from main analysis
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/*.test.*,\
  **/testdata/**,\
  **/build/**,\
  **/bin/**,\
  **/obj/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.gradle/**

# Test inclusions
sonar.tests=src/
sonar.test.inclusions=\
  **/*_test.go,\
  **/*.test.js,\
  **/test_*.py,\
  **/*Tests.cs,\
  **/*Test.java

# Language-specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=coverage.xml
sonar.java.binaries=src/adservice/build/classes

# Encoding
sonar.sourceEncoding=UTF-8
