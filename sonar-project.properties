# =============================================================================
# SonarCloud Configuration – SAST Analysis
# Organization: online-boutique-application-demo
# Project: online-boutique-app
# =============================================================================

sonar.organization=online-boutique-application-demo
sonar.projectKey=online-boutique-app
sonar.projectName=Online Boutique

# Source directories
sonar.sources=src/

# Exclusions – skip vendor, generated, and test files from main analysis
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/*.test.*,\
  **/testdata/**,\
  **/build/**,\
  **/bin/**,\
  **/obj/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.gradle/**

# Test inclusions
sonar.tests=src/
sonar.test.inclusions=\
  **/*_test.go,\
  **/*.test.js,\
  **/test_*.py,\
  **/*Tests.cs,\
  **/*Test.java

# Language-specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=coverage.xml
sonar.java.binaries=src/adservice/build/classes

# Encoding
sonar.sourceEncoding=UTF-8
