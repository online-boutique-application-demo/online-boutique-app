# =============================================================================
# SonarCloud Configuration – SAST Analysis
# Organization: <YOUR_SONAR_ORG>
# Project: <YOUR_SONAR_PROJECT_KEY>
# =============================================================================

sonar.organization=<YOUR_SONAR_ORG>
sonar.projectKey=<YOUR_SONAR_PROJECT_KEY>
sonar.projectName=Online Boutique

# Source directories
sonar.sources=src/

# Exclusions – skip vendor, generated, and test files from main analysis
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/*.test.*,\
  **/testdata/**,\
  **/build/**,\
  **/bin/**,\
  **/obj/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.gradle/**

# Test inclusions
sonar.tests=src/
sonar.test.inclusions=\
  **/*_test.go,\
  **/*.test.js,\
  **/test_*.py,\
  **/*Tests.cs,\
  **/*Test.java

# Language-specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=coverage.xml
sonar.java.binaries=src/adservice/build/classes

# Encoding
sonar.sourceEncoding=UTF-8
