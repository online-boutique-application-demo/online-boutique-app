# =============================================================================
# DAST – Dynamic Application Security Testing (OWASP ZAP)
# Manual trigger: scans a deployed application for runtime vulnerabilities.
# Run AFTER deploying to dev/staging, BEFORE destroying infrastructure.
# =============================================================================

name: Security – DAST Scan (OWASP ZAP)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL of deployed application (e.g. http://<NLB-DNS>)"
        required: true
        type: string
      scan_type:
        description: "Scan type"
        required: true
        type: choice
        options:
          - baseline
          - full
        default: baseline

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: "🌐 OWASP ZAP ${{ inputs.scan_type }} Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        if: inputs.scan_type == 'baseline'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: ".zap/rules.tsv"
          fail_action: "warn"
          allow_issue_writing: true
          artifact_name: "zap-baseline-report"

      - name: ZAP Full Scan
        if: inputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: ".zap/rules.tsv"
          fail_action: "warn"
          allow_issue_writing: true
          artifact_name: "zap-full-report"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "zap-${{ inputs.scan_type }}-report"
          path: "report_html.html"
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "### 🌐 DAST Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`${{ inputs.target_url }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | \`${{ inputs.scan_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Report | See artifacts |" >> $GITHUB_STEP_SUMMARY
