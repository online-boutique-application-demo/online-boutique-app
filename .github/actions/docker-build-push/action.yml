# =============================================================================
# Composite Action: Docker Build & Push to Amazon ECR
# Encapsulates AWS OIDC auth, ECR login, Buildx setup, and image push.
# =============================================================================

name: "Docker Build & Push to ECR"
description: "Authenticates with AWS via OIDC, builds and pushes a Docker image to Amazon ECR"

inputs:
  service:
    description: "Service name"
    required: true
  dockerfile_path:
    description: "Path to Dockerfile"
    required: true
  context_path:
    description: "Docker build context"
    required: true
  tags:
    description: "Comma-separated list of image tags"
    required: true
  image_base:
    description: "Base image URI without tag"
    required: true
  aws_region:
    description: "AWS region"
    required: false
    default: "ap-southeast-1"
  aws_account_id:
    description: "AWS Account ID"
    required: true

outputs:
  image_digest:
    description: "Pushed image digest"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/online-boutique-github-ci
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context_path }}
        file: ${{ inputs.dockerfile_path }}
        push: true
        tags: ${{ inputs.tags }}
        cache-from: type=registry,ref=${{ inputs.image_base }}:buildcache
        cache-to: type=registry,ref=${{ inputs.image_base }}:buildcache,mode=max
        provenance: true
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
