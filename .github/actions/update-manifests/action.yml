# =============================================================================
# Composite Action: Update image tags in online-boutique-config repo
# Called by ci-service.yml after a successful push to ECR on main branch.
# Uses yq to update the image tag in Kustomize overlays.
# =============================================================================

name: "Update Image Manifests in Config Repo"
description: "Updates the image tag in the online-boutique-config GitOps repository"

inputs:
  service:
    description: "Service name (e.g. frontend)"
    required: true
  image_tag:
    description: "New image tag (e.g. sha-abc1234)"
    required: true
  image_full:
    description: "Full image URI (registry/repo:tag)"
    required: true
  config_repo:
    description: "GitHub config repo (owner/name)"
    required: true
  config_repo_token:
    description: "GitHub PAT or App token with write access to config repo"
    required: true
  config_repo_branch:
    description: "Target branch in config repo"
    required: false
    default: "main"

runs:
  using: "composite"
  steps:
    - name: Validate config repository token
      shell: bash
      run: |
        if [[ -z "${{ inputs.config_repo_token }}" ]]; then
          echo "::error::Secret CONFIG_REPO_TOKEN is empty or missing! Please configure this secret in repository settings to allow pushing image tags to the config repository."
          exit 1
        fi

    - name: Checkout online-boutique-config repo
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.config_repo }}
        token: ${{ inputs.config_repo_token }}
        ref: ${{ inputs.config_repo_branch }}
        path: _config_repo

    - name: Install yq
      uses: mikefarah/yq@v4.44.3

    - name: Update image tag and push to config repo (with conflict-free retry)
      shell: bash
      env:
        BRANCH: ${{ inputs.config_repo_branch }}
        SERVICE: ${{ inputs.service }}
        NEW_TAG: ${{ inputs.image_tag }}
      run: |
        cd _config_repo
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

        DEV_KUSTOMIZATION="overlays/dev/kustomization.yaml"
        if [[ ! -f "$DEV_KUSTOMIZATION" ]]; then
          echo "⚠️  No dev kustomization found at $DEV_KUSTOMIZATION – skipping"
          exit 0
        fi

        MAX_RETRIES=15
        for i in $(seq 1 $MAX_RETRIES); do
          if [[ $i -gt 1 ]]; then
            SLEEP_TIME=$(( (RANDOM % 4) + i ))
            echo "⚠️  Push conflict (attempt $((i-1))/$MAX_RETRIES) – waiting ${SLEEP_TIME}s, syncing latest '$BRANCH' and re-applying..."
            sleep "$SLEEP_TIME"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
          fi

          yq e '
            (.images[] | select(.name == "REGISTRY/online-boutique/" + env(SERVICE) or .name == "*/online-boutique/" + env(SERVICE)) | .newTag) = env(NEW_TAG)
          ' -i "$DEV_KUSTOMIZATION"

          git add "$DEV_KUSTOMIZATION"
          if git diff --staged --quiet; then
            echo "✅ No changes to commit – $SERVICE is already at $NEW_TAG"
            exit 0
          fi

          git commit -m "chore(cd): update $SERVICE to $NEW_TAG

          Source: ${{ github.repository }}@${{ github.sha }}
          Workflow: ${{ github.workflow }} #${{ github.run_number }}"

          if git push origin HEAD:"$BRANCH"; then
            echo "✅ Pushed manifest update for $SERVICE to $BRANCH (attempt $i)"
            exit 0
          fi
        done

        echo "::error::Failed to push after $MAX_RETRIES attempts"
        exit 1
